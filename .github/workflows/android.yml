name: Build Android TV APK

on:
  push:
    branches: [main]
    paths: ['android/**', 'nav.js', '.github/workflows/android.yml']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        run: gradle -p android assembleRelease --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk CinejoyTV.apk

      - uses: actions/upload-artifact@v4
        with:
          name: CinejoyTV-apk
          path: CinejoyTV.apk
